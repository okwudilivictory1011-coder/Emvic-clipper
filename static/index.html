<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emvic Clipper - AI Video Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .aspect-9-16 { aspect-ratio: 9 / 16; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex items-center justify-between pb-6 border-b border-slate-800">
      <div>
        <a href="/" class="text-3xl font-extrabold text-white tracking-tight flex items-center gap-2 hover:opacity-95 transition">
          <span class="text-indigo-500">⚡</span>
          <span>Emvic Clipper</span>
        </a>
        <p class="text-xs md:text-sm text-slate-400 mt-1">Transform long videos into viral 1080x1920 Full HD vertical shorts.</p>
      </div>
      <div class="flex items-center gap-2 text-xs bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full text-emerald-400 font-semibold shadow-inner">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 9:16 Full HD (1080x1920)
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-8">
      <!-- Controls -->
      <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 h-fit shadow-2xl backdrop-blur-md">
        <h2 class="text-lg font-bold text-white mb-4">Clip Generator</h2>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">YouTube URL</label>
            <input id="youtubeUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Clip Name Prefix</label>
            <input id="customName" type="text" placeholder="e.g. Emvic_Podcast" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Groq API Key <span class="text-slate-500 normal-case">(optional if set in backend)</span></label>
            <input id="groqKey" type="password" placeholder="Leave blank to use default key" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Number of Clips</label>
              <span id="clipCountLabel" class="text-sm font-bold text-indigo-400">3</span>
            </div>
            <input id="numClips" type="range" min="1" max="10" value="3" oninput="clipCountLabel.innerText = this.value" class="w-full accent-indigo-500 cursor-pointer">
          </div>

          <button id="generateBtn" onclick="startGeneration()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl transition duration-150 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
            <span>⚡ Generate Shorts with Emvic</span>
          </button>
        </div>

        <!-- Live Progress Status -->
        <div id="statusContainer" class="hidden mt-6 pt-5 border-t border-slate-800">
          <div class="flex items-center gap-2.5 text-sm font-medium text-slate-300">
            <svg id="spinner" class="animate-spin h-4 w-4 text-indigo-400" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="statusText">Initializing Emvic Clipper...</span>
          </div>
          <div id="errorBox" class="hidden mt-3 p-3 bg-red-950/60 border border-red-800 text-red-300 text-xs rounded-lg"></div>
        </div>
      </section>

      <!-- Video Feed -->
      <section class="lg:col-span-2">
        <h2 class="text-lg font-bold text-white mb-4">Exported Shorts Gallery</h2>
        <div id="placeholder" class="flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-2xl p-16 text-center text-slate-500">
          <span class="text-5xl mb-3">📱</span>
          <p class="text-sm font-medium">Your 1–2 minute vertical shorts will display here ready for review and instant download.</p>
        </div>

        <div id="clipsGallery" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden"></div>
      </section>
    </div>
  </div>

  <script>
    let pollInterval = null;

    async function startGeneration() {
      const groqKey = document.getElementById('groqKey').value.trim();
      const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
      const customName = document.getElementById('customName').value.trim() || "Emvic_Clip";
      const numClips = parseInt(document.getElementById('numClips').value);

      if (!youtubeUrl) {
        alert("Please enter a YouTube video URL.");
        return;
      }

      document.getElementById('generateBtn').disabled = true;
      document.getElementById('generateBtn').classList.add('opacity-50');
      document.getElementById('statusContainer').classList.remove('hidden');
      document.getElementById('errorBox').classList.add('hidden');
      document.getElementById('spinner').classList.remove('hidden');
      document.getElementById('statusText').innerText = "Queuing pipeline in Emvic Clipper...";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            groq_key: groqKey, 
            youtube_url: youtubeUrl, 
            custom_name: customName,
            num_clips: numClips 
          })
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.message || "Failed to trigger clipping task.");
        }

        pollInterval = setInterval(pollStatus, 2000);
      } catch (err) {
        document.getElementById('errorBox').innerText = err.message;
        document.getElementById('errorBox').classList.remove('hidden');
        resetBtn();
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        if (data.status === "processing") {
          document.getElementById('statusText').innerText = data.step;
        } else if (data.status === "completed") {
          clearInterval(pollInterval);
          document.getElementById('statusText').innerText = "All clips ready!";
          document.getElementById('spinner').classList.add('hidden');
          renderClips(data.clips);
          resetBtn();
        } else if (data.status === "error") {
          clearInterval(pollInterval);
          document.getElementById('statusText').innerText = "Processing error";
          document.getElementById('spinner').classList.add('hidden');
          document.getElementById('errorBox').innerText = data.error;
          document.getElementById('errorBox').classList.remove('hidden');
          resetBtn();
        }
      } catch (err) {
        console.error("Polling error:", err);
      }
    }

    function renderClips(clips) {
      document.getElementById('placeholder').classList.add('hidden');
      const gallery = document.getElementById('clipsGallery');
      gallery.innerHTML = '';
      gallery.classList.remove('hidden');

      clips.forEach((clip) => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-xl";
        card.innerHTML = `
          <div>
            <div class="relative w-full rounded-xl overflow-hidden bg-black aspect-9-16 shadow-inner">
              <video src="${clip.url}" controls class="w-full h-full object-cover"></video>
            </div>
            <h3 class="text-sm font-semibold text-white mt-3 line-clamp-1">${clip.title}</h3>
            <p class="text-xs text-slate-400 mt-0.5">Duration: ${clip.duration}s • 1080x1920 (9:16)</p>
          </div>
          <a href="${clip.url}" download="${clip.filename}" class="mt-4 block text-center w-full bg-slate-800 hover:bg-indigo-600 hover:text-white active:scale-[0.98] text-indigo-400 text-xs font-semibold py-2.5 rounded-lg border border-slate-700 hover:border-transparent transition">
            ⬇ Download (${clip.filename})
          </a>
        `;
        gallery.appendChild(card);
      });
    }

    function resetBtn() {
      document.getElementById('generateBtn').disabled = false;
      document.getElementById('generateBtn').classList.remove('opacity-50');
    }
  </script>
</body>
</html>
